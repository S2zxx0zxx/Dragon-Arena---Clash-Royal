name: Apply UI polish v0.6 and build Android preview
on:
  push:
    branches: [feat/reference-locked-premium-3d-ui]
    paths: ['.build/ui-polish-v6.patch.xz', '.github/workflows/apply-ui-polish-v6.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify delivery checksum and patch source files
        shell: bash
        run: |
          set -euo pipefail
          echo 'f62944c4ad0dfab82c2e4e3374a7658df447a39f29279ba8daec1d5e1a43747d  .build/ui-polish-v6.patch.xz' | sha256sum --check
          xz -dc .build/ui-polish-v6.patch.xz > /tmp/dragon-ui-v6.patch
          git apply --check /tmp/dragon-ui-v6.patch
          git apply /tmp/dragon-ui-v6.patch
          git diff --check
          node --check app/src/main.js
          node --check app/src/renderer.js
          node --check app/src/polish.mjs
      - name: Run full offline game regression suite
        shell: bash
        run: |
          python3 tools/unpack_assets.py
          node --test app/tests/*.test.mjs
      - name: Commit fully expanded implementation to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/android-preview.yml android/app/build.gradle README.md app/engine/arena.mjs app/index.html app/src/main.js app/src/renderer.js app/src/polish.css app/src/polish.mjs app/tests/polish.test.mjs docs/UI_POLISH_v6_ACCEPTANCE.md
          git commit -m 'Polish 3D lobby, live minimap, arena boundary and mobile game UI'
          git push origin 'HEAD:feat/reference-locked-premium-3d-ui'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK"
          echo "sdk.dir=$SDK" > android/local.properties
          SDKMANAGER="$SDK/cmdline-tools/16.0/bin/sdkmanager"
          if ! test -f "$SDK/platforms/android-35/android.jar"; then "$SDKMANAGER" --sdk_root="$SDK" --install 'platforms;android-35'; fi
          if ! test -x "$SDK/build-tools/35.0.0/aapt2"; then "$SDKMANAGER" --sdk_root="$SDK" --install 'build-tools;35.0.0'; fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore verified offline assets and package app
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/unpack_assets.py
          mkdir -p android/app/src/main/assets/www
          cp -a app/. android/app/src/main/assets/www/
          rm -rf android/app/src/main/assets/www/tests
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('android/app/src/main/assets/www')
          data=json.loads((root/'manifest/game_assets.json').read_text())
          assert len(data['characters'])==24
          assert len(list(root.rglob('*.glb'))) >= 80
          for f in ['src/polish.mjs','src/polish.css','src/main.js','src/renderer.js','index.html']:
              assert (root/f).is_file(), f
          print('offline game files verified',len(list(root.rglob('*.glb'))))
          PY
          sed -i "s/if('serviceWorker' in navigator \&\& location.protocol!=='file:')/if('serviceWorker' in navigator \&\& location.protocol!=='file:' \&\& !navigator.userAgent.includes('DragonArenaAndroidPreview'))/" android/app/src/main/assets/www/src/main.js
      - name: Build installable signed preview APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify signed APK and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/app-debug.apk.sha256
          ls -lah android/app/build/outputs/apk/debug
      - uses: actions/upload-artifact@v4
        with:
          name: Dragon-Arena-v0.6.0-Android-Preview
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Publish prerelease APK on the feature-branch commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create android-preview-v0.6.0 \
            android/app/build/outputs/apk/debug/app-debug.apk#Dragon-Arena-Android-Preview-v0.6.0.apk \
            android/app/build/outputs/apk/debug/app-debug.apk.sha256#Dragon-Arena-Android-Preview-v0.6.0.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Dragon Arena Android Preview v0.6.0' \
            --notes 'Offline test preview; 3D hero/lab, real-food minimap, seamless space plane, boundary/camera and mobile Result polish. Not online multiplayer, merchant checkout, production Android QA or release signing.' \
            --prerelease
