name: Validate 3D Foundation
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/unpack_assets.py
      - run: python -m pip install --disable-pip-version-check numpy trimesh pillow
      - run: node --test app/tests/*.test.mjs
      - run: python tools/validate_premium_assets.py
      - run: python tests/validate_bundle.py
