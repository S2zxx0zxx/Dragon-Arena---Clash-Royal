name: Build and publish Dragon Arena v3 Android preview
on:
  push:
    branches: [main]
    paths: ['app/**', 'android/**', 'tools/validate_aaa.py', 'tools/browser_smoke_aaa.py', 'package.json', '.github/workflows/android-preview.yml']
  pull_request:
    paths: ['app/**', 'android/**', 'tools/**', 'package.json', '.github/workflows/android-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dragon-arena-android-v3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm test
      - run: python tools/validate_aaa.py
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/browser_smoke_aaa.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager_path=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$sdkmanager_path"
          if ! test -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"; then
            "$sdkmanager_path" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Package self-contained web game
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -a app/. android/app/src/main/assets/www/
          rm -rf android/app/src/main/assets/www/tests
          test -s android/app/src/main/assets/www/icons/dragon-512.png
          test -s android/app/src/main/assets/www/src/render/webgl_engine.js
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Dragon-Arena-Android-Preview-v3.0.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Dragon-Arena-Android-Preview-v3.0.0.apk
          cd dist
          sha256sum Dragon-Arena-Android-Preview-v3.0.0.apk > Dragon-Arena-Android-Preview-v3.0.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Dragon-Arena-Android-Preview-v3.0.0
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Dragon-Arena-Android-Preview-v3.0.0
          path: dist
      - name: Publish immutable versioned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -c Dragon-Arena-Android-Preview-v3.0.0.apk.sha256
          if gh release view android-preview-v3.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Version already exists; do not overwrite existing release. Bump version for future builds.'
            exit 1
          fi
          gh release create android-preview-v3.0.0 ./*.apk ./*.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Dragon Arena — Android Preview v3.0.0' --notes 'Debug-signed offline test build. Device QA pending; signing key may differ from older previews. Old save migration not verified. No live PvP or payments.' --prerelease
