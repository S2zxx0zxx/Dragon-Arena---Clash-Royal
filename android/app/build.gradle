plugins {
    id 'com.android.application'
}

android {
    namespace 'io.dragonarena.preview'
    compileSdk 35

    defaultConfig {
        applicationId 'io.dragonarena.preview'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '0.9.2-preview'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}
